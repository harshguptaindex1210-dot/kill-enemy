name: Hourly Gate

on:
  schedule:
    - cron: '0,30 * * * *'  # every 30 minutes (at :00 and :30)
  workflow_dispatch:  # manual trigger

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (+ INV-3 bundle gate)
        run: npm run build

      - name: Smoke test
        run: npm run smoke

      - name: Simulate game
        run: npm run sim:game

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = await github.rest.issues.create({
              owner,
              repo,
              title: '⚠️ Hourly gate failed — needs attention',
              body: `The hourly gate workflow failed at ${{ github.run_id }}.\n\nCheck the [run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`,
              labels: ['ci-failure', 'automated']
            });