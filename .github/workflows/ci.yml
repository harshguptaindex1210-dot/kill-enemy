name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (+ INV-3 initial bundle gate)
        run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for puppeteer
        run: npx puppeteer browsers install chrome

      - name: Build
        run: npm run build

      - name: Browser smoke test (vite preview + puppeteer)
        run: node scripts/smoke.mjs
        env:
          # Prefer puppeteer's downloaded Chrome on CI runners.
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
